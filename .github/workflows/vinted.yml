name: Vinted-bot

on:
  schedule:
    # Schemat försöker köra var 15:e minut, men concurrency-spärren nedan
    # ser till att en ny körning aldrig startar förrän föregående är klar –
    # med många Sellpy-sökningar (som tar längre tid) blir det i praktiken
    # tätt inpå varandra utan att någonsin krocka.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
    # Gör att du kan trycka på "Run workflow" manuellt i GitHub för att
    # testköra direkt, utan att vänta på schemat.

concurrency:
  group: vinted-bot-run
  cancel-in-progress: false
  # Om en körning redan pågår när nästa schemalagda körning skulle starta,
  # köar GitHub den nya körningen istället för att starta den parallellt.
  # Max en väntande körning i kön i taget – extra triggers däremellan hoppas
  # över, så det blir aldrig en lång kö av gamla körningar.

permissions:
  contents: write
  # Behövs för att boten ska få spara ner uppdaterad seen_items.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installera beroenden
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Kör Vinted-boten
        env:
          RUN_ONCE: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vinted_bot.py

      - name: Kolla mina egna annonser
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_my_listings.py

      - name: Spara uppdaterad minnesfil
        run: |
          git config user.name "vinted-bot"
          git config user.email "vinted-bot@users.noreply.github.com"
          git add seen_items.json found_items.json my_listings.json
          git diff --quiet --cached || git commit -m "Uppdatera seen_items.json, found_items.json och my_listings.json"
          git push
